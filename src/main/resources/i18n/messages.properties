# Emails (used by registration, email verification and password reset)
mail.verification.subject=Bitte bestätige deine E-Mail-Adresse
mail.verification.body=Hallo,\n\nbitte bestätige deine E-Mail-Adresse für Bike Maintainer über diesen Link:\n\n{0}\n\nDer Link ist 24 Stunden gültig. Falls du dich nicht bei Bike Maintainer registriert hast, kannst du diese E-Mail ignorieren.\n\nDein Bike Maintainer
mail.registrationExists.subject=Registrierungsversuch mit deiner E-Mail-Adresse
mail.registrationExists.body=Hallo,\n\njemand wollte sich mit deiner E-Mail-Adresse bei Bike Maintainer registrieren. Du hast bereits ein Konto.\n\nAnmelden: {0}\nPasswort vergessen: {1}\n\nFalls du das nicht warst, kannst du diese E-Mail ignorieren. An deinem Konto wurde nichts geändert.\n\nDein Bike Maintainer
mail.passwordReset.subject=Passwort zurücksetzen
mail.passwordReset.body=Hallo,\n\nfür dein Konto bei Bike Maintainer wurde ein neues Passwort angefordert. Über diesen Link kannst du es festlegen:\n\n{0}\n\nDer Link ist 1 Stunde gültig. Falls du kein neues Passwort angefordert hast, kannst du diese E-Mail ignorieren.\n\nDein Bike Maintainer
mail.deletionNotice.subject=Dein Konto bei Bike Maintainer wird am {0} gelöscht
mail.deletionNotice.body=Hallo,\n\ndein Zugang zu Bike Maintainer ist abgelaufen. Damit wir keine Daten länger als nötig aufbewahren, heben wir Konten ohne Zugang nur ein Jahr lang auf. Dein Konto wird deshalb am {0} gelöscht – mit allen Fahrzeugen, Wartungsaufgaben, Einträgen im Wartungstagebuch und Kosten. Das lässt sich nicht rückgängig machen.\n\nDu möchtest dein Konto behalten? Melde dich bis dahin an, im Browser oder in der App:\n\n{1}\n\nDann bleibt es ein weiteres Jahr bestehen. Nach der Anmeldung kannst du deine Fahrzeuge auch exportieren.\n\nWenn du nichts tust, wird dein Konto am {0} gelöscht. Eine weitere E-Mail bekommst du dazu nicht.\n\nDein Bike Maintainer
mail.cancellationNotice.subject=Kündigung nach dem ersten Jahr: Abo {1}
mail.cancellationNotice.body=Hallo,\n\nein Abo wurde nach dem ersten Jahr gekündigt. Es darf dann nur noch einen Monat laufen, und der vorausbezahlte Rest wird anteilig erstattet (§ 309 Nr. 9 BGB). Paddle würde es bis zum Ende des bezahlten Zeitraums laufen lassen, deshalb bitte von Hand bei Paddle abwickeln:\n\nKonto (ID): {0}\nAbo bei Paddle: {1}\nKündigung eingegangen: {2}\nEnde nach Monatsfrist: {3}\nBezahlt bis: {4}\nAnteilige Erstattung: {5}\n\n1. Am {3} das Abo bei Paddle sofort kündigen („Cancel immediately“).\n2. Die letzte Zahlung anteilig erstatten. Der Betrag ist aus dem Abo-Preis berechnet; bitte mit der tatsächlichen Zahlung (Steuern, frühere Erstattungen) abgleichen.\n\nDein Bike Maintainer
mail.cancellationNotice.refundUnknown=unbekannt, bitte bei Paddle berechnen
mail.earlyEndScheduled.subject=Kündigung nach dem ersten Jahr: Abo {1} wird am {7} beendet
mail.earlyEndScheduled.body=Hallo,\n\nein Abo wurde nach dem ersten Jahr gekündigt. Es endet nach einem Monat, der vorausbezahlte Rest wird anteilig erstattet (§ 309 Nr. 9 BGB). Das erledigt Bike Maintainer automatisch in der Nacht zum {7}; du bekommst danach eine Mail mit dem Ergebnis.\n\nKonto (ID): {0}\nAbo bei Paddle: {1}\nKündigung eingegangen: {2}\nEnde nach Monatsfrist: {3}\nBezahlt bis: {4}\nVoraussichtliche Erstattung (aus dem Abo-Preis): {5}\n\nNimmt die Person die Kündigung vorher zurück, passiert nichts.\n\nDein Bike Maintainer
mail.earlyEndDone.subject=Abo {1} beendet und anteilig erstattet
mail.earlyEndDone.body=Hallo,\n\nein Abo nach dem ersten Jahr ist bei Paddle beendet (Kündigung mit Monatsfrist oder gelöschtes Konto), und der Rest wurde anteilig erstattet.\n\nKonto (ID): {0}\nAbo bei Paddle: {1}\nKündigung eingegangen: {2}\nEnde nach Monatsfrist: {3}\nBezahlt war bis: {4}\nErstattet (netto, Paddle erstattet die Steuer anteilig dazu): {5}\n\nDein Bike Maintainer
mail.earlyEndFailed.subject=Abo {1}: Ende nach Kündigung bitte von Hand abschließen
mail.earlyEndFailed.body=Hallo,\n\ndas Abo wurde nach dem ersten Jahr gekündigt, aber Bike Maintainer konnte es nicht automatisch abschließen:\n\n{6}\n\nKonto (ID): {0}\nAbo bei Paddle: {1}\nKündigung eingegangen: {2}\nEnde nach Monatsfrist: {3}\nBezahlt bis: {4}\nAnteilige Erstattung (berechnet): {5}\n\nBitte bei Paddle prüfen und von Hand abschließen: das Abo sofort kündigen, falls noch nicht geschehen, und die letzte Zahlung anteilig erstatten. Bike Maintainer versucht es nicht noch einmal.\n\nDein Bike Maintainer
mail.earlyEnd.reason.alreadyEnded=Paddle meldet das Abo als schon beendet (zum Beispiel nach einer Erstattung durch Paddle). Es wurde nichts erstattet.
mail.earlyEnd.reason.noOrder=Das Abo ist beendet, aber Paddle liefert keine bezahlte Zahlung für den laufenden Zeitraum. Es wurde nichts erstattet.
mail.earlyEnd.reason.unreachableBeforeEnd=Paddle war mehrmals nicht erreichbar. Das Abo läuft noch, es wurde nichts erstattet.
mail.earlyEnd.reason.unreachableBeforeRefund=Das Abo ist beendet, aber Paddle war danach mehrmals nicht erreichbar. Die Erstattung fehlt.
mail.earlyEnd.reason.unreachableDuringRefund=Das Abo ist beendet. Die Erstattung wurde angefordert, Paddle war danach aber nicht erreichbar – bitte prüfen, ob sie durchging, bevor du erstattest.
mail.earlyEnd.reason.accountDeleted=Das Konto wurde gelöscht, bevor das vorzeitige Ende abgeschlossen war. Das Abo wurde bei Paddle beendet; bitte die Erstattung bei Paddle prüfen und von Hand ausführen.
mail.earlyEnd.reason.accountDeletedRefund=Das Konto wurde gelöscht und das Abo bei Paddle beendet, aber die anteilige Erstattung ab dem Löschtag konnte nicht angefordert werden. Bitte bei Paddle prüfen und von Hand erstatten.

