# Emails (used by registration, email verification and password reset)
mail.verification.subject=Bitte bestätige deine E-Mail-Adresse
mail.verification.body=Hallo,\n\nbitte bestätige deine E-Mail-Adresse für Bike Maintainer über diesen Link:\n\n{0}\n\nDer Link ist 24 Stunden gültig. Falls du dich nicht bei Bike Maintainer registriert hast, kannst du diese E-Mail ignorieren.\n\nDein Bike Maintainer
mail.registrationExists.subject=Registrierungsversuch mit deiner E-Mail-Adresse
mail.registrationExists.body=Hallo,\n\njemand wollte sich mit deiner E-Mail-Adresse bei Bike Maintainer registrieren. Du hast bereits ein Konto.\n\nAnmelden: {0}\nPasswort vergessen: {1}\n\nFalls du das nicht warst, kannst du diese E-Mail ignorieren. An deinem Konto wurde nichts geändert.\n\nDein Bike Maintainer
mail.passwordReset.subject=Passwort zurücksetzen
mail.passwordReset.body=Hallo,\n\nfür dein Konto bei Bike Maintainer wurde ein neues Passwort angefordert. Über diesen Link kannst du es festlegen:\n\n{0}\n\nDer Link ist 1 Stunde gültig. Falls du kein neues Passwort angefordert hast, kannst du diese E-Mail ignorieren.\n\nDein Bike Maintainer

