# Emails (used by registration, email verification and password reset)
mail.verification.subject=Please confirm your email address
mail.verification.body=Hello,\n\nplease confirm your email address for Bike Maintainer using this link:\n\n{0}\n\nThe link is valid for 24 hours. If you did not sign up for Bike Maintainer, you can ignore this email.\n\nYour Bike Maintainer
mail.registrationExists.subject=Sign-up attempt with your email address
mail.registrationExists.body=Hello,\n\nsomeone tried to sign up for Bike Maintainer with your email address. You already have an account.\n\nLog in: {0}\nForgot password: {1}\n\nIf this was not you, you can ignore this email. Nothing has been changed in your account.\n\nYour Bike Maintainer
mail.passwordReset.subject=Reset your password
mail.passwordReset.body=Hello,\n\na new password was requested for your Bike Maintainer account. You can set it using this link:\n\n{0}\n\nThe link is valid for 1 hour. If you did not request a new password, you can ignore this email.\n\nYour Bike Maintainer
mail.deletionNotice.subject=Your Bike Maintainer account will be deleted on {0}
mail.deletionNotice.body=Hello,\n\nyour access to Bike Maintainer has ended. So that we do not keep data longer than necessary, we only keep accounts without access for one year. Your account will therefore be deleted on {0} – with all vehicles, maintenance tasks, maintenance log entries and costs. This cannot be undone.\n\nWould you like to keep your account? Log in before then, in the browser or in the app:\n\n{1}\n\nIt will then be kept for another year. After logging in you can also export your vehicles.\n\nIf you do nothing, your account will be deleted on {0}. You will not receive another email about it.\n\nYour Bike Maintainer
mail.cancellationNotice.subject=Cancellation after the first year: subscription {1}
mail.cancellationNotice.body=Hello,\n\na subscription was cancelled after its first year. It may then only run for one more month, and the prepaid rest is refunded pro rata (§ 309 no. 9 BGB). Polar would let it run until the end of the paid period, so please handle it by hand in Polar:\n\nAccount (ID): {0}\nSubscription at Polar: {1}\nCancellation received: {2}\nEnd after one month: {3}\nPaid until: {4}\nPro-rata refund: {5}\n\n1. On {3}, end the subscription in Polar immediately (revoke).\n2. Refund the last payment pro rata. The amount is calculated from the subscription price; please check it against the actual payment (taxes, earlier refunds).\n\nYour Bike Maintainer
mail.cancellationNotice.refundUnknown=unknown, please calculate it in Polar
mail.earlyEndScheduled.subject=Cancellation after the first year: subscription {1} ends on {7}
mail.earlyEndScheduled.body=Hello,\n\na subscription was cancelled after its first year. It ends after one month, and the prepaid rest is refunded pro rata (§ 309 no. 9 BGB). Bike Maintainer does this automatically in the night to {7}; you will get an email with the result.\n\nAccount (ID): {0}\nSubscription at Polar: {1}\nCancellation received: {2}\nEnd after one month: {3}\nPaid until: {4}\nExpected refund (from the subscription price): {5}\n\nIf the person takes the cancellation back before, nothing happens.\n\nYour Bike Maintainer
mail.earlyEndDone.subject=Subscription {1} ended and refunded pro rata
mail.earlyEndDone.body=Hello,\n\nthe subscription cancelled after its first year has been ended at Polar, and the rest was refunded pro rata.\n\nAccount (ID): {0}\nSubscription at Polar: {1}\nCancellation received: {2}\nEnd after one month: {3}\nWas paid until: {4}\nRefunded (net; Polar adds the tax pro rata): {5}\n\nYour Bike Maintainer
mail.earlyEndFailed.subject=Subscription {1}: please finish the early end by hand
mail.earlyEndFailed.body=Hello,\n\nthe subscription was cancelled after its first year, but Bike Maintainer could not finish it automatically:\n\n{6}\n\nAccount (ID): {0}\nSubscription at Polar: {1}\nCancellation received: {2}\nEnd after one month: {3}\nPaid until: {4}\nPro-rata refund (calculated): {5}\n\nPlease check in Polar and finish it by hand: end the subscription (revoke) if not done yet, and refund the last payment pro rata. Bike Maintainer will not try again.\n\nYour Bike Maintainer
mail.earlyEnd.reason.alreadyEnded=Polar reports the subscription as already ended (e.g. after a refund by Polar). Nothing was refunded.
mail.earlyEnd.reason.noOrder=The subscription is ended, but Polar reports no paid payment for the current period. Nothing was refunded.
mail.earlyEnd.reason.unreachableBeforeEnd=Polar could not be reached several times. The subscription is still running, nothing was refunded.
mail.earlyEnd.reason.unreachableBeforeRefund=The subscription is ended, but Polar could not be reached several times afterwards. The refund is missing.
mail.earlyEnd.reason.unreachableDuringRefund=The subscription is ended. The refund was requested, but Polar could not be reached afterwards – please check whether it went through before refunding.

