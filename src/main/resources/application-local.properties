# Local development (./mvnw spring-boot:run and the development compose.yaml activate this profile).
# Emails are not sent but written to the log (LoggingMailService), including the links.
# Never use this profile in production: the ALTCHA key below is public.
bm.altcha.hmac-key=local-development-key-not-for-production

# Swagger UI for trying out the API: http://localhost:8080/swagger-ui.html (after login / profile selection)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
