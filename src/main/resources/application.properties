spring.application.name=maintenance
info.app.version=@project.version@

server.port=8080
management.server.port=8081

spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:maintenance}
spring.datasource.username=${DB_USERNAME:maintenance}
spring.datasource.password=${DB_PASSWORD:maintenance}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.initialAdminEmail=${bm.initial-admin.email}

# Initial admin: owns all vehicles that existed before user accounts. The password is hashed and set
# once on startup if the account has none yet; it is never overwritten afterwards.
bm.initial-admin.email=${BM_INITIAL_ADMIN_EMAIL:admin@localhost}
bm.initial-admin.password=${BM_INITIAL_ADMIN_PASSWORD:}

# Sessions are stored in the database (Spring Session JDBC, tables from Flyway V5) and survive restarts.
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Behind the frontend nginx/TLS proxy: Tomcat's RemoteIpValve takes client IP and scheme (Secure cookies)
# from X-Forwarded-* headers, but only when the request comes from an internal proxy address.
server.forward-headers-strategy=native

# Per-IP rate limit for public auth endpoints and per-account lockout after failed logins.
bm.security.rate-limit-max-attempts=10
bm.security.rate-limit-window=15m
bm.security.lockout-max-failed-attempts=10
bm.security.lockout-duration=15m
