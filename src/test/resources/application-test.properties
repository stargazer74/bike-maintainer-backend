# Test profile: only the deviations from src/main/resources/application.properties. Every Spring test activates it
# with @ActiveProfiles("test") (enforced by SpringTestProfileTest).

# In-memory H2 in MariaDB mode instead of a real database.
spring.datasource.url=jdbc:h2:mem:maintenance;MODE=MariaDB;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Fixed, so that a BM_MODE in the developer's environment does not change the tests; the household suite
# overrides it (HouseholdCucumberSpringConfiguration).
bm.mode=portal

# Portal mode refuses to start without a mail host and an ALTCHA key (PortalStartupCheck). No mail is actually
# sent: the tests replace the mail service.
spring.mail.host=localhost
bm.altcha.hmac-key=test-key
# Cheapest proof of work, so the registration scenarios solve the challenge instantly.
bm.altcha.cost=1
