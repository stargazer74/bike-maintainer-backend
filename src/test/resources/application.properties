spring.application.name=maintenance
info.app.version=@project.version@

server.port=8080
management.server.port=8081

spring.datasource.url=jdbc:h2:mem:maintenance;MODE=MariaDB;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Translations for emails and the PDF report (i18n/messages*.properties). German is the base file and the
# fallback for every other locale; the server's own locale never plays a role.
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Fixed, so that a BM_MODE in the developer's environment does not change the tests; the household suite
# overrides it (HouseholdCucumberSpringConfiguration).
bm.mode=portal

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.initialAdminEmail=${bm.initial-admin.email}

# Initial admin: owns all vehicles that existed before user accounts. The password is hashed and set
# once on startup if the account has none yet; it is never overwritten afterwards.
bm.initial-admin.email=${BM_INITIAL_ADMIN_EMAIL:admin@localhost}
bm.initial-admin.password=${BM_INITIAL_ADMIN_PASSWORD:}

# Sessions are stored in the database (Spring Session JDBC, tables from Flyway V5) and survive restarts.
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Behind the frontend nginx/TLS proxy: Tomcat's RemoteIpValve takes client IP and scheme (Secure cookies)
# from X-Forwarded-* headers, but only when the request comes from an internal proxy address.
server.forward-headers-strategy=native

# Per-IP rate limit for public auth endpoints and per-account lockout after failed logins.
bm.security.rate-limit-max-attempts=10
bm.security.rate-limit-window=15m
bm.security.lockout-max-failed-attempts=10
bm.security.lockout-duration=15m

# Emails (registration, email verification). SMTP via spring.mail.*; required in portal mode unless the profile
# local is active, which only logs emails (see PortalStartupCheck).
spring.mail.host=localhost
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Without timeouts a stalled SMTP server would block the async mail threads forever (default: infinite).
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# /actuator/health must not depend on the SMTP server (and household mode has none).
management.health.mail.enabled=false
bm.mail.from=${BM_MAIL_FROM:noreply@bike-maintainer.de}
# All emails per day together; on reaching it, register/resend answer 429 MAIL_QUOTA_EXCEEDED.
bm.mail.daily-limit=100
# Address of the app the links in emails point to, e.g. https://app.bike-maintainer.de
bm.mail.link-base-url=${BM_PUBLIC_URL:http://localhost:4200}

# ALTCHA proof-of-work captcha for registration. The HMAC key is required in portal mode.
bm.altcha.hmac-key=test-key
bm.altcha.cost=1
bm.altcha.validity=5m

# Daily cleanup of expired tokens and of accounts that were not verified within 7 days.
bm.cleanup.cron=0 30 3 * * *

# Swagger UI and /v3/api-docs only for local development (enabled in application-local.properties). The API is
# contract-first: the spec lives in the bike-maintainer-api repo, clients are generated from it.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
