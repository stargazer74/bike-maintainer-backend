name: CI

on:
  pull_request:
  push:
    branches: [ main ]
    # Release tags (vX.Y.Z) additionally publish the images, see the publish job.
    tags: [ 'v*.*.*' ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Upload of the Trivy results to the Security tab.
      security-events: write
    steps:
      - name: Check out backend
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The backend consumes the API spec as Maven artifact, which is not published anywhere. Build it from the
      # api repo: the branch with the same name if it exists (PRs that depend on an open API PR), else main.
      - name: Select API branch
        id: api-branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/stargazer74/bike-maintainer-api.git "$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out API spec (${{ steps.api-branch.outputs.ref }})
        uses: actions/checkout@v7
        with:
          repository: stargazer74/bike-maintainer-api
          ref: ${{ steps.api-branch.outputs.ref }}
          path: .ci/bike-maintainer-api

      - name: Install API spec into the local Maven repository
        working-directory: .ci/bike-maintainer-api
        run: mvn -B -ntp install

      # Release builds carry the tag version (info.app.version, JAR name); all other builds keep the pom version.
      - name: Set release version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./mvnw -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build and test
        run: ./mvnw -B -ntp verify

      # The image contains the OS packages of the base image and the JAR with all Maven dependencies, so one Trivy scan
      # covers both. Scanned for linux/amd64; the arm64 variant uses the same base image release. Runs for PRs, main and
      # release tags – publish needs this job, so a failing scan would also stop a release.
      - name: Build image for scanning
        run: docker build -t bike-maintainer-backend:scan .

      # Report only for now (exit-code 0): findings go to Security → Code scanning. Once the existing findings are
      # dealt with, switch to exit-code 1 so that CRITICAL/HIGH vulnerabilities with an available fix fail the build.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: bike-maintainer-backend:scan
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'

      # Pull requests from forks get no write token; their results are only in the log.
      - name: Upload Trivy results
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Upload JAR for the image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

  # Builds the multi-arch image (amd64 + arm64) from the tested JAR and pushes it to ghcr.io – only for release tags,
  # not for pushes to main or PRs. Tag vX.Y.Z -> image tags X.Y.Z, X.Y, X and latest.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out backend
        uses: actions/checkout@v7

      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: target

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
