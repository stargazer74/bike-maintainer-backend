name: CodeQL

on:
  pull_request:
  push:
    branches: [ main ]
  # Weekly, so that new queries and newly published vulnerability patterns also hit unchanged code.
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Check out backend
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Same as in ci.yml: the generated API interfaces need the spec artifact, built from the api repo (same-named
      # branch if it exists, else main).
      - name: Select API branch
        id: api-branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/stargazer74/bike-maintainer-api.git "$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out API spec (${{ steps.api-branch.outputs.ref }})
        uses: actions/checkout@v7
        with:
          repository: stargazer74/bike-maintainer-api
          ref: ${{ steps.api-branch.outputs.ref }}
          path: .ci/bike-maintainer-api

      - name: Install API spec into the local Maven repository
        working-directory: .ci/bike-maintainer-api
        run: mvn -B -ntp install

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      # Only the code compiled after init is analysed; the API spec above is not part of it.
      - name: Compile
        run: ./mvnw -B -ntp -DskipTests compile

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
